  <script>
/*
 * Reusable components. Every page template is assembled from these.
 * Each component root has a data-c attribute naming it, which the
 * "Template view" toggle in the header reveals.
 */
(function () {
  const M = FX.model;
  const { esc, icons } = FX.h;
  const T = FX.TYPES;
  const U = {};

  /* ---------- Local storage, guarded ---------- */
  FX.store = {
    get(k, d) {
      try {
        const v = localStorage.getItem('fx:' + k);
        return v == null ? d : JSON.parse(v);
      } catch (e) {
        return d;
      }
    },
    set(k, v) {
      try {
        localStorage.setItem('fx:' + k, JSON.stringify(v));
      } catch (e) {}
    },
  };

  U.typeIcon = { concept: icons.book, guide: icons.wrench, journey: icons.route, release: icons.spark };

  U.badge = (type, withTagline) =>
    `<span class="badge badge-${type}" data-c="Type badge">${T[type].label}${withTagline ? `<span class="badge-tag">${T[type].tagline}</span>` : ''}</span>`;

  U.crumbs = (list) =>
    `<nav class="crumbs" aria-label="Breadcrumb" data-c="Breadcrumb"><ol>${list
      .map((c, i) => {
        const last = i === list.length - 1;
        const inner = c[1] && !last ? `<a href="#${c[1]}">${esc(c[0])}</a>` : `<span${last ? ' aria-current="page"' : ''}>${esc(c[0])}</span>`;
        return `<li>${inner}</li>`;
      })
      .join('')}</ol></nav>`;

  /* ---------- Sidebar navigation tree ---------- */
  FX.navOpen = new Set(FX.store.get('navOpen', []));
  const saveOpen = () => FX.store.set('navOpen', [...FX.navOpen]);
  U.saveOpen = saveOpen;

  function treeItems(type, items, activeSlug, path, query) {
    return items
      .map((it) => {
        if (typeof it === 'string') {
          const p = M.page(type, it);
          if (!p) return '';
          const active = it === activeSlug;
          const href = M.href(type, it) + (query || '');
          return `<li><a class="tree-link${active ? ' active' : ''}" href="#${href}"${active ? ' aria-current="page"' : ''}>${esc(p.title)}</a></li>`;
        }
        const id = `${type}:${path}/${it.id}`;
        return treeGroup(type, it, id, activeSlug, path + '/' + it.id, true);
      })
      .join('');
  }

  function treeGroup(type, node, id, activeSlug, path, nested) {
    const containsActive = activeSlug && M.ancestors(type, activeSlug).some((a) => a.id === node.id);
    if (containsActive) FX.navOpen.add(id);
    const open = FX.navOpen.has(id);
    return `<li class="tree-group${open ? ' open' : ''}${nested ? ' nested' : ''}${containsActive ? ' has-active' : ''}" data-node="${esc(id)}">
      <button type="button" class="tree-toggle" aria-expanded="${open}">${icons.chevron}<span>${esc(node.title)}</span>${nested ? '' : `<span class="tree-count">${M.countItems(node.items)}</span>`}</button>
      <ul class="tree-children">${treeItems(type, node.items, activeSlug, path)}</ul>
    </li>`;
  }

  U.tree = (type, activeSlug, { landingActive } = {}) => {
    const sec = FX.content[type];
    let groups;
    if (type === 'journey') {
      groups = treeItems(type, sec.categories[0].items, activeSlug, '');
    } else {
      groups = sec.categories.map((cat) => treeGroup(type, cat, `${type}:/${cat.id}`, activeSlug, '/' + cat.id, false)).join('');
    }
    saveOpen();
    return `<ul class="tree" role="list">
      <li><a class="tree-link tree-overview${landingActive ? ' active' : ''}" href="#${T[type].base}"${landingActive ? ' aria-current="page"' : ''}>Overview</a></li>
      ${groups}
    </ul>`;
  };

  U.primaryNav = (activeId) =>
    FX.SECTIONS.map((s) => `<a href="#${s.route}" class="pnav-link${s.id === activeId ? ' active' : ''}"${s.id === activeId ? ' aria-current="page"' : ''}>${s.label}</a>`).join('');

  U.sidebar = (type, inner, { filter = true } = {}) => `
    <aside class="sidebar is-sticky" id="sidebar" aria-label="${type ? T[type].plural : 'Documentation'} navigation" data-c="Sidebar navigation">
      <div class="sidebar-inner">
        <div class="sidebar-mobile-head"><span>Menu</span><button type="button" class="icon-btn" data-close-nav aria-label="Close navigation">${icons.x}</button></div>
        <nav class="sidebar-primary" aria-label="Primary">${U.primaryNav(type || 'home')}</nav>
        ${
          type
            ? `<div class="sidebar-head"><a href="#${T[type].base}" class="sidebar-title">${U.typeIcon[type]}${T[type].plural}</a><span class="sidebar-tagline">${T[type].tagline}</span></div>
        ${filter ? `<div class="sidebar-filter"><label class="sr-only" for="nav-filter">Filter ${T[type].plural.toLowerCase()}</label>${icons.search}<input id="nav-filter" type="search" placeholder="Filter ${T[type].plural.toLowerCase()}" autocomplete="off"></div>` : ''}`
            : ''
        }
        ${inner || ''}
      </div>
    </aside>
    <div class="scrim" data-close-nav></div>`;

  /* ---------- On this page ---------- */
  U.toc = (items, title = 'On this page') =>
    items.length
      ? `<nav class="toc" aria-label="${title}" data-c="On this page"><div class="toc-title">${title}</div><ul>${items
          .map((it) => `<li class="lvl-${it.level || 2}"><a href="#${it.id}" data-scroll="${it.id}">${esc(it.title)}</a></li>`)
          .join('')}</ul></nav>`
      : '';

  U.tocInline = (items) =>
    items.length
      ? `<details class="toc-inline" data-c="On this page · compact"><summary>On this page</summary><ul>${items
          .filter((i) => (i.level || 2) === 2)
          .map((it) => `<li><a href="#${it.id}" data-scroll="${it.id}">${esc(it.title)}</a></li>`)
          .join('')}</ul></details>`
      : '';

  /* ---------- Cards ---------- */
  U.docCard = (type, slug, { query = '', showBadge = true } = {}) => {
    const p = M.page(type, slug);
    if (!p) return '';
    return `<a class="doc-card" href="#${M.href(type, slug)}${query}" data-c="Doc card">
      ${showBadge ? U.badge(type) : ''}
      <span class="doc-card-title">${esc(p.title)}</span>
      <span class="doc-card-desc">${esc(p.summary)}</span>
    </a>`;
  };

  U.linkRow = (type, slug, query = '') => {
    const p = M.page(type, slug);
    if (!p) return '';
    return `<a class="link-row" href="#${M.href(type, slug)}${query}"><span class="link-row-icon t-${type}">${U.typeIcon[type]}</span><span class="link-row-text"><span class="link-row-title">${esc(p.title)}</span><span class="link-row-desc">${esc(p.summary)}</span></span>${icons.chevron}</a>`;
  };

  /* ---------- Previous / next ---------- */
  U.prevNext = (type, slug) => {
    const { prev, next } = M.prevNext(type, slug);
    const card = (s, dir) => {
      if (!s) return '<span></span>';
      const p = M.page(type, s);
      return `<a class="pn pn-${dir}" href="#${M.href(type, s)}" rel="${dir}"><span class="pn-label">${dir === 'prev' ? icons.arrowLeft + 'Previous' : 'Next' + icons.arrowRight}</span><span class="pn-title">${esc(p.title)}</span></a>`;
    };
    return `<nav class="prevnext" aria-label="Previous and next ${T[type].plural.toLowerCase()}" data-c="Previous / next">${card(prev, 'prev')}${card(next, 'next')}</nav>`;
  };

  /* ---------- Feedback ---------- */
  U.feedback = () => `
    <section class="feedback" data-feedback data-c="Feedback">
      <div class="fb-ask">
        <span class="fb-q">Was this page helpful?</span>
        <div class="fb-btns">
          <button type="button" class="btn btn-secondary btn-sm" data-fb="yes">${icons.thumbUp}Yes</button>
          <button type="button" class="btn btn-secondary btn-sm" data-fb="no">${icons.thumbDown}No</button>
        </div>
      </div>
      <form class="fb-form" hidden>
        <fieldset>
          <legend>What went wrong?</legend>
          <label><input type="radio" name="fb-reason" id="fb-r1" value="missing" checked> Information is missing</label>
          <label><input type="radio" name="fb-reason" id="fb-r2" value="unclear"> Instructions were unclear</label>
          <label><input type="radio" name="fb-reason" id="fb-r3" value="wrong"> Something is out of date or incorrect</label>
        </fieldset>
        <label class="fb-label" for="fb-text">Tell us more (optional)</label>
        <textarea id="fb-text" rows="3" placeholder="What were you trying to do?"></textarea>
        <div class="fb-actions"><button type="submit" class="btn btn-sm">Send feedback</button><button type="button" class="btn btn-ghost btn-sm" data-fb="cancel">Cancel</button></div>
      </form>
      <p class="fb-thanks" hidden role="status">Thanks for your feedback. It helps us improve Fixiam Documentation.</p>
    </section>`;

  /* ---------- Journey progress ---------- */
  U.journeyDone = (slug) => new Set(FX.store.get('journey:' + slug, []));
  U.setJourneyDone = (slug, set) => FX.store.set('journey:' + slug, [...set]);

  U.progressBar = (done, total, label = true) => {
    const pct = total ? Math.round((done / total) * 100) : 0;
    return `<div class="progress" data-c="Progress"><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-label="Journey progress"><span style="width:${pct}%"></span></div>${label ? `<span class="progress-label">${done} of ${total} stages complete</span>` : ''}</div>`;
  };

  // Shown on a concept or guide opened from a journey stage.
  U.journeyBanner = (q) => {
    const j = q.journey && M.page('journey', q.journey);
    if (!j) return '';
    const n = Math.min(Math.max(parseInt(q.stage, 10) || 1, 1), j.stages.length);
    const stage = j.stages[n - 1];
    const nextStage = j.stages[n];
    const base = M.href('journey', q.journey);
    const dots = j.stages.map((_, i) => `<i class="${i + 1 < n ? 'past' : i + 1 === n ? 'now' : ''}"></i>`).join('');
    return `<aside class="journey-banner" data-c="Journey context banner" aria-label="Journey context">
      <div class="jb-main">
        <span class="jb-eyebrow">${icons.route}Journey · Stage ${n} of ${j.stages.length}</span>
        <a class="jb-title" href="#${base}?stage=${n}">${esc(j.title)}</a>
        <span class="jb-stage">${esc(stage.title)}</span>
        <span class="jb-dots" aria-hidden="true">${dots}</span>
      </div>
      <div class="jb-actions">
        <a class="btn btn-secondary btn-sm" href="#${base}?stage=${n}">${icons.arrowLeft}Back to journey</a>
        ${nextStage ? `<a class="btn btn-sm" href="#${base}?stage=${n + 1}">Next stage${icons.arrowRight}</a>` : ''}
      </div>
    </aside>`;
  };

  /* ---------- Search results ---------- */
  U.searchItem = (r, q, extraAttrs = '') => `
    <a class="sr-item" href="#${r.href}" data-result ${extraAttrs}>
      <span class="sr-icon t-${r.type}">${U.typeIcon[r.type]}</span>
      <span class="sr-text">
        <span class="sr-title">${FX.highlight(r.title, q)}</span>
        <span class="sr-desc">${FX.highlight(r.summary, q)}</span>
        <span class="sr-meta">${U.badge(r.type)}<span class="sr-section">${esc(r.section)}</span></span>
      </span>
    </a>`;

  U.noResults = (q, compact) => `
    <div class="no-results${compact ? ' compact' : ''}" data-c="Search · no results">
      <div class="nr-icon">${icons.search}</div>
      <p class="nr-title">No results for “${esc(q)}”</p>
      <p class="nr-text">Check the spelling, try a more general term, or search for a product area such as users, applications or devices.</p>
      <div class="chips">${FX.POPULAR_SEARCHES.map((s) => `<a class="chip" href="#/search?q=${encodeURIComponent(s)}" data-suggest="${esc(s)}">${esc(s)}</a>`).join('')}</div>
      ${compact ? '' : `<p class="nr-text">Or browse <a href="#/concepts">Concepts</a>, <a href="#/guides">Guides</a> or <a href="#/journeys">Journeys</a>.</p>`}
    </div>`;

  U.searchCompact = (q, perGroup = 4) => {
    if (!q.trim()) {
      const recent = FX.store.get('recent', []).slice(0, 4);
      return `<div class="sr-empty">
        <div class="sr-group-h">Popular searches</div>
        <div class="chips">${FX.POPULAR_SEARCHES.map((s) => `<button type="button" class="chip" data-suggest="${esc(s)}">${esc(s)}</button>`).join('')}</div>
        ${recent.length ? `<div class="sr-group-h">Recently viewed</div>${recent.map((r) => `<a class="sr-recent" href="#${r.href}" data-result>${U.badge(r.type)}<span>${esc(r.title)}</span></a>`).join('')}` : ''}
      </div>`;
    }
    const results = FX.search(q);
    if (!results.length) return U.noResults(q, true);
    const groups = FX.searchGroups(results);
    return (
      groups
        .map(
          (g) => `<div class="sr-group" role="group" aria-label="${T[g.type].plural}"><div class="sr-group-h">${T[g.type].plural}<span>${g.items.length}</span></div>${g.items
            .slice(0, perGroup)
            .map((r) => U.searchItem(r, q))
            .join('')}</div>`
        )
        .join('') + `<a class="sr-all" href="#/search?q=${encodeURIComponent(q)}" data-result>See all ${results.length} result${results.length === 1 ? '' : 's'} for “${esc(q)}”${icons.arrowRight}</a>`
    );
  };

  FX.ui = U;
})();

</script>
  <script>
/*
 * Page templates. One template per page type:
 *   home · section landing (concepts, guides) · concept article · guide article
 *   journeys landing · journey · release notes · search · prototype notes · not found
 * Templates return { title, html } and never contain page-specific content.
 */
(function () {
  const M = FX.model;
  const U = FX.ui;
  const { esc, icons, note } = FX.h;
  const T = FX.TYPES;
  const TPL = {};

  const docsLayout = ({ sidebar, main, rail, wide, cls = '' }) => `
    <div class="docs${rail ? ' has-rail' : ''} ${cls}">
      ${sidebar}
      <div class="docs-content">
        <div class="docs-mobilebar"><button type="button" class="btn btn-secondary btn-sm" data-open-nav aria-controls="sidebar">${icons.menu}<span>Menu</span></button></div>
        <main id="main" class="docs-main${wide ? ' wide' : ''}" tabindex="-1">${main}</main>
      </div>
      ${rail ? `<aside class="rail is-sticky" aria-label="Page navigation">${rail}</aside>` : ''}
    </div>`;

  const h2 = (id, title) => `<h2 id="${id}" class="anchor-h">${esc(title)}<a class="anchor-link" href="#${id}" data-scroll="${id}" aria-label="Link to ${esc(title)}">#</a></h2>`;

  const pageHeader = ({ type, title, summary, meta = '', crumbs }) => `
    ${U.crumbs(crumbs)}
    <header class="page-head" data-c="Page header">
      ${type ? U.badge(type, true) : ''}
      <h1>${esc(title)}</h1>
      ${summary ? `<p class="lead">${summary}</p>` : ''}
      ${meta ? `<div class="meta-row">${meta}</div>` : ''}
    </header>`;

  const metaItem = (icon, text) => `<span class="meta">${icons[icon]}${text}</span>`;

  /* =========================== HOME =========================== */
  TPL.home = () => {
    const cards = [
      { type: 'concept', title: 'Learn Fixiam', desc: 'Understand identity, authentication, access and the concepts behind Fixiam.', cta: 'Explore concepts' },
      { type: 'guide', title: 'Guides', desc: 'Step by step instructions for configuring and managing Fixiam.', cta: 'Browse guides' },
      { type: 'journey', title: 'Journeys', desc: 'Follow end to end paths for achieving larger identity and access outcomes.', cta: 'Explore journeys' },
      { type: 'release', title: 'Release Notes', desc: "See what's new, improved and fixed in Fixiam.", cta: 'View release notes' },
    ];
    const count = (type) => (type === 'release' ? `${FX.releases.length} updates` : `${Object.keys(FX.content[type].pages).length} ${type === 'journey' ? 'journeys' : 'articles'}`);
    const popular = [
      ['Set up Single Sign On', 'guide', 'configure-saml-sso'],
      ['Configure Multi Factor Authentication', 'guide', 'configure-mfa'],
      ['Add users', 'guide', 'add-user'],
      ['Connect Active Directory', 'guide', 'connect-active-directory'],
      ['Manage devices', 'guide', 'enroll-windows-device'],
      ['Configure access requests', 'guide', 'create-access-request'],
      ['Set up application roles', 'guide', 'configure-application-roles'],
      ['Connect an HR source', 'guide', 'connect-hr-source'],
    ];
    const latest = FX.releases.slice(0, 4);
    const featured = ['roll-out-sso', 'automate-onboarding-offboarding'];
    const main = `
      <section class="hero" data-c="Home hero">
        <div class="hero-inner">
          <h1>Fixiam Documentation</h1>
          <p class="lead">${esc(FX.SITE.tagline)}</p>
          <div class="hero-search" data-c="Search field">
            <form class="hero-form" role="search" data-hero-search>
              <label for="hero-q" class="sr-only">Search Fixiam documentation</label>
              ${icons.search}
              <input id="hero-q" type="search" placeholder="Search Fixiam documentation..." autocomplete="off" aria-controls="hero-results" aria-expanded="false" role="combobox">
              <kbd class="hero-kbd">/</kbd>
            </form>
            <div class="sr-panel hero-panel" id="hero-results" role="listbox" hidden></div>
          </div>
          <div class="hero-try"><span>Try</span>${FX.POPULAR_SEARCHES.slice(0, 5).map((s) => `<a class="chip" href="#/search?q=${encodeURIComponent(s)}">${esc(s)}</a>`).join('')}</div>
        </div>
      </section>

      <div class="home-body">
        <section class="discover" aria-label="Documentation areas">
          ${cards
            .map(
              (c) => `<a class="discover-card t-${c.type}" href="#${T[c.type].base}" data-c="Discovery card">
              <span class="dc-top"><span class="dc-icon">${U.typeIcon[c.type]}</span><span class="dc-tag">${T[c.type].tagline}</span></span>
              <span class="dc-title">${c.title}</span>
              <span class="dc-desc">${c.desc}</span>
              <span class="dc-foot"><span class="dc-cta">${c.cta}${icons.arrowRight}</span><span class="dc-count">${count(c.type)}</span></span>
            </a>`
            )
            .join('')}
        </section>

        <section class="home-section" aria-labelledby="popular-h">
          <div class="section-h"><h2 id="popular-h">Popular topics</h2><a href="#/guides" class="more-link">All guides${icons.arrowRight}</a></div>
          <div class="popular-grid" data-c="Popular topics">
            ${popular
              .map(([label, type, slug]) => {
                const cat = M.category(type, slug);
                return `<a class="popular" href="#${M.href(type, slug)}"><span class="popular-title">${esc(label)}</span><span class="popular-meta">${T[type].label} · ${esc(cat ? cat.title : '')}</span></a>`;
              })
              .join('')}
          </div>
        </section>

        <div class="home-split">
          <section class="home-section" aria-labelledby="journeys-h">
            <div class="section-h"><h2 id="journeys-h">Start with a journey</h2><a href="#/journeys" class="more-link">All journeys${icons.arrowRight}</a></div>
            <div class="stack">
              ${featured
                .map((s) => {
                  const j = M.page('journey', s);
                  return `<a class="journey-mini" href="#${M.href('journey', s)}"><span class="jm-stages">${j.stages.length}<small>stages</small></span><span><span class="jm-title">${esc(j.title)}</span><span class="jm-desc">${esc(j.summary)}</span></span></a>`;
                })
                .join('')}
            </div>
          </section>
          <section class="home-section" aria-labelledby="new-h">
            <div class="section-h"><h2 id="new-h">What's new</h2><a href="#/release-notes" class="more-link">All release notes${icons.arrowRight}</a></div>
            <ul class="whatsnew" data-c="Latest release notes">
              ${latest
                .map((r) => `<li><a href="#/release-notes/${r.date.slice(0, 7)}?section=${r.id}"><span class="cat cat-${r.category}">${FX.RN_CATEGORIES[r.category].label}</span><span class="wn-title">${esc(r.title)}</span><time datetime="${r.date}">${M.fmtDate(r.date)}</time></a></li>`)
                .join('')}
            </ul>
          </section>
        </div>

        <section class="home-section" aria-labelledby="org-h">
          <div class="section-h"><h2 id="org-h">How the documentation is organized</h2></div>
          <div class="principles" data-c="Content type principles">
            ${['concept', 'guide', 'journey', 'release']
              .map((t) => `<div class="principle t-${t}"><span class="pr-quote">“${T[t].tagline}.”</span>${U.badge(t)}<p>${esc(T[t].intro)}</p></div>`)
              .join('')}
          </div>
        </section>
      </div>`;
    const sidebar = U.sidebar(null, '', { filter: false }).replace('class="sidebar is-sticky"', 'class="sidebar is-sticky drawer-only"');
    return { title: FX.SITE.name, html: `<div class="home">${sidebar}<main id="main" tabindex="-1">${main}</main></div>`, home: true };
  };

  /* ====================== SECTION LANDING ====================== */
  TPL.landing = (type) => {
    const sec = FX.content[type];
    const crumbs = [['Docs', '/'], [T[type].plural]];
    let body = '';
    if (type === 'guide') {
      const start = sec.categories[0];
      body += `<section class="start-here" aria-labelledby="start-h" data-c="Start here">
        <h2 id="start-h" class="h-small">New to Fixiam? Start here</h2>
        <ol class="start-list">${start.items.map((s, i) => `<li><a href="#${M.href(type, s)}"><span class="start-n">${i + 1}</span><span><strong>${esc(M.page(type, s).title)}</strong><span>${esc(M.page(type, s).summary)}</span></span></a></li>`).join('')}</ol>
      </section>
      <div class="area-grid">${sec.categories
        .map((cat) => {
          const list = (items, depth = 0) =>
            items
              .map((it) =>
                typeof it === 'string'
                  ? `<li><a href="#${M.href(type, it)}">${esc(M.page(type, it).title)}</a></li>`
                  : `<li class="area-sub"><span>${esc(it.title)}</span><ul>${list(it.items, depth + 1)}</ul></li>`
              )
              .join('');
          return `<section class="area-card" id="${cat.id}" data-c="Product area card"><h2 class="area-title">${esc(cat.title)}<span class="tree-count">${M.countItems(cat.items)}</span></h2><p>${esc(cat.desc)}</p><ul class="area-list">${list(cat.items)}</ul></section>`;
        })
        .join('')}</div>`;
    } else {
      body += sec.categories
        .map(
          (cat) => `<section class="cat-section" id="${cat.id}">${h2(cat.id + '-h', cat.title)}<p class="cat-desc">${esc(cat.desc)}</p><div class="card-grid">${cat.items.map((s) => U.docCard(type, s, { showBadge: false })).join('')}</div></section>`
        )
        .join('');
    }
    const main = `${pageHeader({ type, title: T[type].plural, summary: esc(T[type].intro), crumbs })}
      <p class="type-note">${icons.info}<span>${esc(T[type].notFor)}</span></p>
      ${body}`;
    const toc = sec.categories.map((c) => ({ id: type === 'guide' ? c.id : c.id + '-h', title: c.title }));
    return {
      title: `${T[type].plural} | ${FX.SITE.name}`,
      html: docsLayout({ sidebar: U.sidebar(type, U.tree(type, null, { landingActive: true })), main, rail: U.toc(toc, 'Categories'), wide: true }),
    };
  };

  /* ========================== ARTICLE ========================== */
  const relatedSection = (id, title, type, slugs, q = '') =>
    slugs && slugs.filter((s) => M.exists(type, s)).length
      ? `<section class="related" aria-labelledby="${id}" data-c="Related documentation">${h2(id, title)}<div class="link-rows">${slugs.map((s) => U.linkRow(type, s, q)).join('')}</div></section>`
      : '';

  const partOfJourneys = (type, slug) => {
    const js = M.journeysUsing(type, slug);
    if (!js.length) return '';
    return `<section class="part-of" data-c="Part of journeys"><div class="part-of-h">${icons.route}<span>This ${T[type].label.toLowerCase()} is part of ${js.length === 1 ? 'a journey' : js.length + ' journeys'}</span></div>
      <ul>${js.map((j) => `<li><a href="#${M.href('journey', j.slug)}?stage=${j.stage}">${esc(j.journey.title)}</a><span>Stage ${j.stage} of ${j.journey.stages.length} · ${esc(j.journey.stages[j.stage - 1].title)}</span></li>`).join('')}</ul></section>`;
  };

  function conceptBody(p) {
    const toc = [];
    let html = '';
    (p.sections || []).forEach((s) => {
      toc.push({ id: s.id, title: s.title });
      html += `<section class="prose-section">${h2(s.id, s.title)}${s.html}</section>`;
    });
    if (p.terms && p.terms.length) {
      toc.push({ id: 'terminology', title: 'Common terminology' });
      html += `<section class="prose-section">${h2('terminology', 'Common terminology')}<dl class="terms" data-c="Terminology list">${p.terms.map((t) => `<div><dt>${esc(t.term)}</dt><dd>${t.def}</dd></div>`).join('')}</dl></section>`;
    }
    if ((p.related.concepts || []).length) toc.push({ id: 'related-concepts', title: 'Related concepts' });
    if ((p.related.guides || []).length) toc.push({ id: 'related-guides', title: 'Related guides' });
    html += relatedSection('related-concepts', 'Related concepts', 'concept', p.related.concepts);
    html += relatedSection('related-guides', 'Related guides', 'guide', p.related.guides);
    return { html, toc };
  }

  function guideBody(p) {
    const toc = [];
    let html = '';
    const outline = p.steps.some((s) => typeof s === 'string');
    toc.push({ id: 'accomplish', title: 'What you will accomplish' });
    html += `<section class="accomplish" data-c="What you will accomplish">${h2('accomplish', 'What you will accomplish')}<ul class="check-list">${p.accomplish.map((a) => `<li>${icons.check}<span>${a}</span></li>`).join('')}</ul></section>`;
    toc.push({ id: 'prerequisites', title: 'Prerequisites' });
    html += `<section class="prose-section" data-c="Prerequisites">${h2('prerequisites', 'Prerequisites')}<ul class="prereq-list">${p.prereqs.map((a) => `<li><span class="box" aria-hidden="true"></span><span>${a}</span></li>`).join('')}</ul></section>`;
    toc.push({ id: 'steps', title: 'Steps' });
    html += `<section class="prose-section">${h2('steps', 'Steps')}${
      outline ? note('This is an outline sample page. Final instructions and screenshots will be added with the production content.', 'Sample outline') : ''
    }<ol class="steps" data-c="Numbered steps">${p.steps
      .map((s, i) => {
        const st = typeof s === 'string' ? { title: s } : s;
        const id = `step-${i + 1}`;
        toc.push({ id, title: `${i + 1}. ${st.title}`, level: 3 });
        return `<li class="step" id="${id}"><span class="step-n" aria-hidden="true">${i + 1}</span><div class="step-body"><h3>${esc(st.title)}</h3>${st.html || ''}${st.shot ? FX.h.shot(st.shot) : ''}</div></li>`;
      })
      .join('')}</ol></section>`;
    toc.push({ id: 'result', title: 'Expected result' });
    html += `<section class="prose-section">${h2('result', 'Expected result')}<div class="result-box" data-c="Expected result">${icons.checkCircle}<p>${p.result}</p></div></section>`;
    if (p.troubleshooting && p.troubleshooting.length) {
      toc.push({ id: 'troubleshooting', title: 'Troubleshooting' });
      html += `<section class="prose-section">${h2('troubleshooting', 'Troubleshooting')}<div class="accordion" data-c="Troubleshooting accordion">${p.troubleshooting
        .map((t) => `<details><summary>${t.q}${icons.chevronDown}</summary><div class="acc-body"><p>${t.a}</p></div></details>`)
        .join('')}</div></section>`;
    }
    if ((p.related.guides || []).length) toc.push({ id: 'related-guides', title: 'Related guides' });
    if ((p.related.concepts || []).length) toc.push({ id: 'related-concepts', title: 'Learn the concepts' });
    html += relatedSection('related-guides', 'Related guides', 'guide', p.related.guides);
    html += relatedSection('related-concepts', 'Learn the concepts', 'concept', p.related.concepts);
    return { html, toc };
  }

  TPL.article = (type, slug, q) => {
    const p = M.page(type, slug);
    if (!p) return TPL.notFound();
    const anc = M.ancestors(type, slug);
    const crumbs = [['Docs', '/'], [T[type].plural, T[type].base]];
    anc.forEach((a, i) => crumbs.push([a.title, i === 0 ? `${T[type].base}?section=${type === 'guide' ? a.id : a.id + '-h'}` : null]));
    crumbs.push([p.title]);

    const { html, toc } = type === 'concept' ? conceptBody(p) : guideBody(p);
    const read = M.readingTime(html);
    let meta = metaItem('calendar', `Updated <time datetime="${p.updated}">${M.fmtDateLong(p.updated)}</time>`);
    if (type === 'guide') meta += metaItem('clock', `About ${esc(p.time)}`) + metaItem('user', esc(p.role));
    else meta += metaItem('book', `${read} min read`);
    meta += `<button type="button" class="meta meta-btn" data-copy-link>${icons.link}Copy link</button>`;

    FX.rememberRecent({ type, title: p.title, href: M.href(type, slug) });

    const main = `
      ${U.journeyBanner(q)}
      ${pageHeader({ type, title: p.title, summary: esc(p.summary), meta, crumbs })}
      ${U.tocInline(toc)}
      <div class="prose" data-c="${T[type].label} body">${html}</div>
      ${partOfJourneys(type, slug)}
      ${U.feedback()}
      ${U.prevNext(type, slug)}`;
    return {
      title: `${p.title} | ${FX.SITE.name}`,
      html: docsLayout({ sidebar: U.sidebar(type, U.tree(type, slug)), main, rail: U.toc(toc) + railHelp() }),
    };
  };

  const railHelp = () => `<div class="rail-help"><span>Need more help?</span><a href="#" data-toast="Prototype: this would open the Fixiam support portal.">Contact Fixiam support</a></div>`;

  /* ====================== JOURNEYS LANDING ====================== */
  TPL.journeysLanding = () => {
    const pages = FX.content.journey.pages;
    const crumbs = [['Docs', '/'], ['Journeys']];
    const cards = Object.keys(pages)
      .map((slug) => {
        const j = pages[slug];
        const done = U.journeyDone(slug).size;
        return `<a class="journey-card" href="#${M.href('journey', slug)}" data-c="Journey card">
          <span class="jc-top">${U.badge('journey')}<span class="effort effort-${j.effort.toLowerCase()}">${j.effort} effort</span></span>
          <span class="jc-title">${esc(j.title)}</span>
          <span class="jc-desc">${esc(j.summary)}</span>
          <dl class="jc-meta">
            <div><dt>Who it is for</dt><dd>${esc(j.audience)}</dd></div>
            <div><dt>Stages</dt><dd>${j.stages.length}</dd></div>
            <div><dt>Typical duration</dt><dd>${esc(j.duration)}</dd></div>
          </dl>
          <span class="jc-steps" aria-hidden="true">${j.stages.map((_, i) => `<i class="${i < done ? 'done' : ''}"></i>`).join('')}</span>
          <span class="jc-foot">${done ? `<span class="jc-progress">${done} of ${j.stages.length} complete</span>` : '<span></span>'}<span class="dc-cta">${done ? 'Continue journey' : 'Start journey'}${icons.arrowRight}</span></span>
        </a>`;
      })
      .join('');
    const compare = `<div class="compare" data-c="Content type comparison">
      <div><span class="cmp-k">${U.badge('concept')}</span><strong>Teach me</strong><span>One idea, explained.</span></div>
      <div><span class="cmp-k">${U.badge('guide')}</span><strong>Show me how</strong><span>One task, step by step.</span></div>
      <div class="is-current"><span class="cmp-k">${U.badge('journey')}</span><strong>Take me from beginning to end</strong><span>Several concepts and guides, in order, toward one outcome.</span></div>
    </div>`;
    const main = `${pageHeader({ type: 'journey', title: 'Journeys', summary: esc(T.journey.intro), crumbs })}${compare}<div class="journey-grid">${cards}</div>`;
    return { title: `Journeys | ${FX.SITE.name}`, html: docsLayout({ sidebar: U.sidebar('journey', U.tree('journey', null, { landingActive: true }), { filter: false }), main, wide: true }) };
  };

  /* ========================== JOURNEY ========================== */
  TPL.journey = (slug, q) => {
    const j = M.page('journey', slug);
    if (!j) return TPL.notFound();
    const done = U.journeyDone(slug);
    const current = j.stages.findIndex((_, i) => !done.has(i + 1)) + 1; // 0 if all done
    const crumbs = [['Docs', '/'], ['Journeys', '/journeys'], [j.title]];
    FX.rememberRecent({ type: 'journey', title: j.title, href: M.href('journey', slug) });

    const meta = `<dl class="journey-facts" data-c="Journey facts">
      <div><dt>Who it is for</dt><dd>${esc(j.audience)}</dd></div>
      <div><dt>Stages</dt><dd>${j.stages.length}</dd></div>
      <div><dt>Effort</dt><dd><span class="effort effort-${j.effort.toLowerCase()}">${j.effort}</span></dd></div>
      <div><dt>Typical duration</dt><dd>${esc(j.duration)}</dd></div>
    </dl>`;

    const stageLinks = (list, type, n) =>
      list.filter((s) => M.exists(type, s)).map((s) => `<a class="stage-link t-${type}" href="#${M.href(type, s)}?journey=${slug}&stage=${n}">${U.typeIcon[type]}<span>${esc(M.page(type, s).title)}</span></a>`).join('');

    const stages = j.stages
      .map((s, i) => {
        const n = i + 1;
        const state = done.has(n) ? 'done' : n === current ? 'current' : 'upcoming';
        const learn = stageLinks(s.learn || [], 'concept', n);
        const doo = stageLinks(s.do || [], 'guide', n);
        return `<li class="stage stage-${state}" id="stage-${n}" data-stage="${n}" data-c="Journey stage">
          <div class="stage-marker" aria-hidden="true"><span class="stage-dot">${state === 'done' ? icons.check : n}</span></div>
          <div class="stage-card">
            <div class="stage-head">
              <span class="stage-eyebrow">Stage ${n} of ${j.stages.length}${state === 'current' ? '<span class="stage-now">You are here</span>' : ''}${state === 'done' ? '<span class="stage-complete">Complete</span>' : ''}</span>
              <h2 class="stage-title">${esc(s.title)}</h2>
            </div>
            <div class="stage-text">${s.html}</div>
            ${learn || doo ? `<div class="stage-links">
              ${learn ? `<div class="stage-col"><span class="stage-col-h">Learn</span>${learn}</div>` : ''}
              ${doo ? `<div class="stage-col"><span class="stage-col-h">Do</span>${doo}</div>` : ''}
            </div>` : ''}
            ${s.checklist ? `<div class="stage-check"><span class="stage-col-h">Before you move on</span><ul>${s.checklist.map((c) => `<li>${icons.check}${esc(c)}</li>`).join('')}</ul></div>` : ''}
            <div class="stage-foot">
              <button type="button" class="btn ${state === 'done' ? 'btn-ghost' : state === 'current' ? '' : 'btn-secondary'} btn-sm" data-stage-toggle="${n}">${state === 'done' ? 'Mark as not complete' : `${icons.check}Mark stage complete`}</button>
            </div>
          </div>
        </li>`;
      })
      .join('');

    const next = (j.next || []).filter((s) => M.exists('journey', s));
    const allDone = done.size === j.stages.length;
    const main = `
      ${pageHeader({ type: 'journey', title: j.title, summary: esc(j.summary), crumbs, meta: metaItem('calendar', `Updated <time datetime="${j.updated}">${M.fmtDateLong(j.updated)}</time>`) })}
      ${meta}
      <section class="outcome" data-c="Journey outcome"><h2 class="h-small">By the end of this journey</h2><ul class="check-list">${j.outcome.map((o) => `<li>${icons.check}<span>${esc(o)}</span></li>`).join('')}</ul></section>
      <div class="journey-progress" data-c="Journey progress">
        ${U.progressBar(done.size, j.stages.length)}
        <div class="jp-actions">
          ${allDone ? '<span class="jp-done">Journey complete</span>' : `<a class="btn btn-sm" href="#${M.href('journey', slug)}?stage=${current}">${done.size ? 'Continue' : 'Start'} at stage ${current}${icons.arrowRight}</a>`}
          ${done.size ? '<button type="button" class="btn btn-ghost btn-sm" data-journey-reset>Reset progress</button>' : ''}
        </div>
      </div>
      <p class="type-note">${icons.info}<span>Each stage links to what to <strong>learn</strong> (concepts) and what to <strong>do</strong> (guides). Guides opened from a stage keep this journey in view so you can come back.</span></p>
      <ol class="stages">${stages}</ol>
      ${next.length ? `<section class="related">${h2('next-journeys', 'Where to go next')}<div class="link-rows">${next.map((s) => U.linkRow('journey', s)).join('')}</div></section>` : ''}
      ${U.feedback()}`;

    const stepper = `<nav class="stepper" aria-label="Journey stages" data-c="Journey stepper">
      <div class="toc-title">Journey stages</div>
      ${U.progressBar(done.size, j.stages.length, false)}
      <ol>${j.stages.map((s, i) => `<li class="${done.has(i + 1) ? 'done' : i + 1 === current ? 'current' : ''}"><a href="#stage-${i + 1}" data-scroll="stage-${i + 1}"><span class="sp-dot">${done.has(i + 1) ? icons.check : i + 1}</span><span>${esc(s.title)}</span></a></li>`).join('')}</ol>
    </nav>`;
    return {
      title: `${j.title} | ${FX.SITE.name}`,
      html: docsLayout({ sidebar: U.sidebar('journey', U.tree('journey', slug), { filter: false }), main, rail: stepper, cls: 'is-journey' }),
    };
  };

  /* ======================= RELEASE NOTES ======================= */
  TPL.releases = (ym, q) => {
    const months = M.releaseMonths();
    const years = [...new Set(months.map(([m]) => m.slice(0, 4)))];
    const year = ym ? ym.slice(0, 4) : q.year || '';
    const cat = q.cat || '';
    const validYm = ym && months.find(([m]) => m === ym);
    if (ym && !validYm) return TPL.notFound();

    const inScope = (r) => (!ym || r.date.startsWith(ym)) && (!year || r.date.startsWith(year));
    const scoped = FX.releases.filter(inScope);
    const shown = scoped.filter((r) => !cat || r.category === cat);
    const counts = { '': scoped.length };
    Object.keys(FX.RN_CATEGORIES).forEach((c) => (counts[c] = scoped.filter((r) => r.category === c).length));

    const build = (o) => {
      const y = o.year !== undefined ? o.year : year;
      const m = o.ym !== undefined ? o.ym : ym;
      const c = o.cat !== undefined ? o.cat : cat;
      const qs = new URLSearchParams();
      if (!m && y) qs.set('year', y);
      if (c) qs.set('cat', c);
      const s = qs.toString();
      return `/release-notes${m ? '/' + m : ''}${s ? '?' + s : ''}`;
    };
    FX.rnBuild = build;

    // Archive sidebar
    const archive = `<ul class="tree" role="list">
      <li><a class="tree-link tree-overview${!ym && !year ? ' active' : ''}" href="#/release-notes">All release notes</a></li>
      ${years
        .map((y) => {
          const id = 'release:/' + y;
          if (year === y || (!year && y === years[0])) FX.navOpen.add(id);
          const open = FX.navOpen.has(id);
          return `<li class="tree-group${open ? ' open' : ''}" data-node="${id}"><button type="button" class="tree-toggle" aria-expanded="${open}">${icons.chevron}<span>${y}</span><span class="tree-count">${FX.releases.filter((r) => r.date.startsWith(y)).length}</span></button>
          <ul class="tree-children">
            <li><a class="tree-link${!ym && year === y ? ' active' : ''}" href="#/release-notes?year=${y}">All of ${y}</a></li>
            ${months
              .filter(([m]) => m.startsWith(y))
              .map(([m, list]) => `<li><a class="tree-link${ym === m ? ' active' : ''}" href="#/release-notes/${m}"${ym === m ? ' aria-current="page"' : ''}>${M.MONTHS[+m.slice(5) - 1]}<span class="tree-count">${list.length}</span></a></li>`)
              .join('')}
          </ul></li>`;
        })
        .join('')}
    </ul>`;
    U.saveOpen();

    const monthsForYear = months.filter(([m]) => !year || m.startsWith(year));
    const filters = `<div class="rn-filters" data-c="Release note filters" role="search" aria-label="Filter release notes">
      <div class="rn-selects">
        <label class="field"><span>Year</span><select id="rn-year"><option value="">All years</option>${years.map((y) => `<option value="${y}"${y === year ? ' selected' : ''}>${y}</option>`).join('')}</select></label>
        <label class="field"><span>Month</span><select id="rn-month"><option value="">All months</option>${monthsForYear.map(([m]) => `<option value="${m}"${m === ym ? ' selected' : ''}>${M.monthLabel(m)}</option>`).join('')}</select></label>
      </div>
      <div class="chip-group" role="group" aria-label="Category">
        ${[['', 'All'], ...Object.entries(FX.RN_CATEGORIES).map(([k, v]) => [k, v.label])]
          .map(([k, label]) => `<a class="chip chip-filter${k ? ' cat-chip-' + k : ''}" href="#${build({ cat: k })}" aria-pressed="${cat === k}" data-replace>${label}<span>${counts[k]}</span></a>`)
          .join('')}
      </div>
    </div>`;

    const groups = M.releaseMonths()
      .map(([m, list]) => [m, list.filter((r) => shown.includes(r))])
      .filter(([, list]) => list.length);
    const entries = groups.length
      ? groups
          .map(
            ([m, list]) => `<section class="rn-month" aria-labelledby="m-${m}">
        <h2 id="m-${m}" class="rn-month-h"><a href="#/release-notes/${m}">${M.monthLabel(m)}</a><span>${list.length} update${list.length === 1 ? '' : 's'}</span></h2>
        <div class="rn-list">${list
          .map((r) => {
            const c = FX.RN_CATEGORIES[r.category];
            const links = r.links.filter((l) => l[1]);
            return `<article class="rn" id="${r.id}" data-c="Release note entry">
              <div class="rn-date"><time datetime="${r.date}">${M.fmtDate(r.date)}</time></div>
              <div class="rn-body">
                <div class="rn-tags"><span class="cat cat-${r.category}" title="${esc(c.desc)}">${c.label}</span><span class="rn-area">${esc(r.area)}</span></div>
                <h3 class="rn-title">${esc(r.title)}</h3>
                <p class="rn-summary">${esc(r.summary)}</p>
                <details class="rn-details"${q.section === r.id ? ' open' : ''}><summary>Details${icons.chevronDown}</summary>
                  <div class="rn-detail-body">${r.details}
                    <dl class="rn-facts"><div><dt>Affected area</dt><dd>${esc(r.area)}</dd></div><div><dt>Released</dt><dd>${M.fmtDateLong(r.date)}</dd></div></dl>
                    ${links.length ? `<div class="rn-links"><span>Related documentation</span>${links.map(([label, href]) => `<a href="#${href}">${esc(label)}${icons.arrowRight}</a>`).join('')}</div>` : ''}
                  </div>
                </details>
              </div>
            </article>`;
          })
          .join('')}</div>
      </section>`
          )
          .join('')
      : `<div class="no-results" data-c="Empty state"><p class="nr-title">No release notes match these filters</p><p class="nr-text">Try another category or month.</p><a class="btn btn-secondary btn-sm" href="#/release-notes">Clear filters</a></div>`;

    // Month-to-month archive navigation
    let monthNav = '';
    if (ym) {
      const idx = months.findIndex(([m]) => m === ym);
      const newer = months[idx - 1], older = months[idx + 1];
      monthNav = `<nav class="prevnext" aria-label="Archive">${older ? `<a class="pn pn-prev" href="#/release-notes/${older[0]}"><span class="pn-label">${icons.arrowLeft}Older</span><span class="pn-title">${M.monthLabel(older[0])}</span></a>` : '<span></span>'}${newer ? `<a class="pn pn-next" href="#/release-notes/${newer[0]}"><span class="pn-label">Newer${icons.arrowRight}</span><span class="pn-title">${M.monthLabel(newer[0])}</span></a>` : '<span></span>'}</nav>`;
    }

    const crumbs = [['Docs', '/'], ['Release Notes', ym || year ? '/release-notes' : null]];
    if (ym) crumbs.push([M.monthLabel(ym)]);
    else if (year) crumbs.push([year]);
    const title = ym ? `Release notes: ${M.monthLabel(ym)}` : year ? `Release notes: ${year}` : 'Release Notes';
    const main = `${pageHeader({ type: 'release', title, summary: esc(T.release.intro), crumbs })}${filters}<div class="rn-wrap">${entries}</div>${monthNav}`;

    const legend = `<div class="rn-legend" data-c="Category legend"><div class="toc-title">Categories</div><dl>${Object.entries(FX.RN_CATEGORIES)
      .map(([k, v]) => `<div><dt><span class="cat cat-${k}">${v.label}</span></dt><dd>${esc(v.desc)}</dd></div>`)
      .join('')}</dl></div>
      <div class="rn-subscribe"><div class="toc-title">Stay up to date</div><p>Get release notes by email or RSS.</p><button type="button" class="btn btn-secondary btn-sm" data-toast="Prototype: this would subscribe you to release note emails.">${icons.rss}Subscribe</button></div>`;
    return { title: `${title} | ${FX.SITE.name}`, html: docsLayout({ sidebar: U.sidebar('release', archive, { filter: false }), main, rail: legend }) };
  };

  /* =========================== SEARCH =========================== */
  TPL.search = (q) => {
    const query = q.q || '';
    const type = q.type || '';
    const results = query ? FX.search(query) : [];
    const groups = FX.searchGroups(results);
    const tabs = [['', 'All', results.length], ...['concept', 'guide', 'journey', 'release'].map((t) => [t, T[t].plural, results.filter((r) => r.type === t).length])];
    let body;
    if (!query) body = `<p class="muted">Enter a search term above, or try one of these: ${FX.POPULAR_SEARCHES.map((s) => `<a href="#/search?q=${encodeURIComponent(s)}">${esc(s)}</a>`).join(', ')}.</p>`;
    else if (!results.length) body = U.noResults(query);
    else {
      const visible = groups.filter((g) => !type || g.type === type);
      body = visible
        .map((g) => `<section class="sr-page-group" aria-labelledby="g-${g.type}"><h2 id="g-${g.type}" class="sr-page-h">${U.typeIcon[g.type]}${T[g.type].plural}<span>${g.items.length}</span></h2>${g.items.map((r) => U.searchItem(r, query)).join('')}</section>`)
        .join('');
    }
    const main = `
      ${U.crumbs([['Docs', '/'], ['Search']])}
      <header class="page-head"><h1>${query ? `Search results for “${esc(query)}”` : 'Search documentation'}</h1>${query ? `<p class="lead">${results.length} result${results.length === 1 ? '' : 's'} across Concepts, Guides, Journeys and Release Notes.</p>` : ''}</header>
      <form class="search-page-form" role="search" data-search-page>
        <label for="sp-q" class="sr-only">Search Fixiam documentation</label>${icons.search}
        <input id="sp-q" type="search" value="${esc(query)}" placeholder="Search Fixiam documentation..." autocomplete="off">
        <button class="btn btn-sm" type="submit">Search</button>
      </form>
      ${query && results.length ? `<div class="tabs-row" role="tablist" aria-label="Filter by documentation type" data-c="Search type filter">${tabs
        .map(([k, label, n]) => `<a role="tab" class="tab-pill" aria-selected="${type === k}" href="#/search?q=${encodeURIComponent(query)}${k ? '&type=' + k : ''}" data-replace>${label}<span>${n}</span></a>`)
        .join('')}</div>` : ''}
      <div class="sr-page" data-c="Search results">${body}</div>`;
    return { title: `Search | ${FX.SITE.name}`, html: `<div class="page-narrow"><main id="main" tabindex="-1">${main}</main></div>` };
  };

  /* ====================== PROTOTYPE NOTES ====================== */
  TPL.about = () => {
    const rows = [
      ['Home', '<code>/</code>', 'Entry point, search, discovery cards, popular topics'],
      ['Section landing', '<code>/concepts</code>, <code>/guides</code>', 'Category overview with cards or product-area lists'],
      ['Concept article', '<code>/concepts/:slug</code>', 'Sections, diagrams, terminology, related concepts and guides'],
      ['Guide article', '<code>/guides/:slug</code>', 'Accomplish, prerequisites, numbered steps, result, troubleshooting'],
      ['Journeys landing', '<code>/journeys</code>', 'Journey cards with audience, stages, effort, progress'],
      ['Journey', '<code>/journeys/:slug</code>', 'Stages with Learn and Do links, progress, stepper'],
      ['Release notes', '<code>/release-notes</code>, <code>/release-notes/:yyyy-mm</code>', 'Chronological entries with year, month and category filters'],
      ['Search', '<code>/search?q=</code>', 'Grouped results, type filter, no-results state'],
    ];
    const comps = ['Top navigation', 'Sidebar navigation tree', 'Breadcrumb', 'Type badge', 'Page header', 'On this page', 'Callout', 'Code block', 'Table', 'Tabs', 'Diagram', 'Screenshot placeholder', 'Numbered steps', 'Expected result', 'Troubleshooting accordion', 'Related documentation', 'Part of journeys', 'Journey context banner', 'Journey stage', 'Journey stepper', 'Release note entry', 'Search palette', 'Feedback', 'Previous / next'];
    const main = `
      ${U.crumbs([['Docs', '/'], ['Prototype notes']])}
      <header class="page-head"><h1>About this prototype</h1><p class="lead">This prototype shows how Fixiam Documentation should behave end to end. All content is realistic sample content and will be replaced.</p></header>
      <div class="prose">
        <section class="prose-section">${h2('templates', 'Page templates')}<p>Every page is rendered from one of these templates. Content files supply data only.</p>${FX.h.table(['Template', 'Route', 'Contains'], rows)}</section>
        <section class="prose-section">${h2('components', 'Reusable components')}<p>Turn on <button type="button" class="btn btn-secondary btn-sm" data-annotate>${icons.grid}Template view</button> to outline and label every component on any page.</p><div class="chips">${comps.map((c) => `<span class="chip static">${c}</span>`).join('')}</div></section>
        <section class="prose-section">${h2('content-model', 'Content model')}<p>Each type has a fixed shape so authors cannot blur Concepts, Guides and Journeys.</p>${FX.h.code(`guide: {
  title, summary, updated, time, role, keywords[],
  accomplish[], prereqs[],
  steps[{ title, html, shot? }],
  result, troubleshooting[{ q, a }],
  related: { concepts[], guides[] }
}`, 'Guide shape')}</section>
        <section class="prose-section">${h2('growth', 'Adding a Developers section later')}<p>Primary navigation is generated from <code>FX.SECTIONS</code> and content types from <code>FX.TYPES</code> in <code>assets/js/config.js</code>. A Developers section needs one entry in each, a content file, and a template if API reference pages need a different layout.</p></section>
        <section class="prose-section">${h2('flows', 'Flows to try')}<ul>
          <li>Search for <a href="#/search?q=SSO">SSO</a>, <a href="#/search?q=device">device</a> or <a href="#/search?q=kubernetes">kubernetes</a> (no results). Press <kbd>/</kbd> or <kbd>Ctrl</kbd> <kbd>K</kbd> anywhere.</li>
          <li>Open <a href="#/concepts/single-sign-on">Single Sign On</a>, then follow a related guide.</li>
          <li>Start <a href="#/journeys/roll-out-sso">Roll out SSO</a>, open a guide from stage 4, then return with the journey banner.</li>
          <li>Filter <a href="#/release-notes?cat=security">security release notes</a>, then browse the archive.</li>
        </ul></section>
      </div>`;
    return { title: `Prototype notes | ${FX.SITE.name}`, html: `<div class="page-narrow"><main id="main" tabindex="-1">${main}</main></div>` };
  };

  TPL.notFound = () => ({
    title: `Page not found | ${FX.SITE.name}`,
    html: `<div class="page-narrow"><main id="main" tabindex="-1">
      <header class="page-head nf"><span class="nf-code">404</span><h1>We couldn’t find that page</h1><p class="lead">The page may have moved, or the link may be incorrect. Try searching, or start from one of these sections.</p></header>
      <div class="card-grid">${['concept', 'guide', 'journey', 'release'].map((t) => `<a class="doc-card" href="#${T[t].base}">${U.badge(t)}<span class="doc-card-title">${T[t].plural}</span><span class="doc-card-desc">${esc(T[t].intro)}</span></a>`).join('')}</div>
    </main></div>`,
  });

  FX.tpl = TPL;
})();

</script>
  <script>
/*
 * App shell: header, router, search palette and page behaviours.
 *
 * Routing uses the URL hash (#/guides/add-user?journey=...) so the prototype
 * runs from any static host or straight from the file system. The router also
 * keeps its own copy of the current route, so navigation still works in
 * sandboxed viewers that do not allow hash changes.
 */
(function () {
  const U = FX.ui;
  const M = FX.model;
  const { icons, esc } = FX.h;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];

  /* ---------------- Recently viewed ---------------- */
  FX.rememberRecent = (item) => {
    const list = FX.store.get('recent', []).filter((r) => r.href !== item.href);
    list.unshift(item);
    FX.store.set('recent', list.slice(0, 6));
  };

  /* ---------------- Toast ---------------- */
  let toastTimer;
  FX.toast = (msg) => {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 2800);
  };

  /* ---------------- Theme ---------------- */
  const root = document.documentElement;
  const savedTheme = FX.store.get('theme', null);
  if (savedTheme) root.setAttribute('data-theme', savedTheme);
  const isDark = () => root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);

  /* ---------------- Header ---------------- */
  const logo = `<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="logo-bg"/><path d="M11 8.5h11M11 8.5v15M11 15.5h7.5" class="logo-f"/><circle cx="22" cy="22.5" r="2.4" class="logo-dot"/></svg>`;

  function renderHeader() {
    $('#header').innerHTML = `
      <div class="topbar-inner">
        <button type="button" class="icon-btn menu-btn" data-open-nav aria-label="Open navigation">${icons.menu}</button>
        <a class="brand" href="#/" aria-label="Fixiam Documentation home">${logo}<span class="brand-name">Fixiam</span><span class="brand-docs">Documentation</span></a>
        <nav class="primary-nav" aria-label="Primary" id="primary-nav"></nav>
        <div class="topbar-actions">
          <button type="button" class="search-trigger" data-open-search aria-label="Search documentation">${icons.search}<span class="st-text">Search Fixiam documentation...</span><kbd>/</kbd></button>
          <a class="proto-pill" href="#/about" title="About this prototype">Prototype</a>
          <button type="button" class="icon-btn" data-annotate aria-pressed="false" title="Template view: label reusable components">${icons.grid}<span class="sr-only">Template view</span></button>
          <button type="button" class="icon-btn" data-theme-toggle title="Switch theme"><span class="sr-only">Switch theme</span><span class="theme-icon"></span></button>
          <a class="btn btn-secondary btn-sm console-link" href="#" data-toast="Prototype: this would open the Fixiam Admin Console.">Admin Console</a>
        </div>
      </div>`;
    updateThemeIcon();
  }
  const updateThemeIcon = () => {
    const el = $('.theme-icon');
    if (el) el.innerHTML = isDark() ? icons.sun : icons.moon;
  };

  /* ---------------- Router ---------------- */
  let currentRoute = null;
  const parse = (r) => {
    const [path, qs] = r.split('?');
    return { path: path.replace(/\/+$/, '') || '/', query: Object.fromEntries(new URLSearchParams(qs || '')) };
  };
  const hashRoute = () => (location.hash.startsWith('#/') ? decodeURI(location.hash.slice(1)) : null);

  FX.go = (to, { replace = false } = {}) => {
    const prev = currentRoute;
    currentRoute = to;
    try {
      if (replace) history.replaceState(null, '', '#' + to);
      else if (hashRoute() !== to) location.hash = to;
    } catch (e) {}
    render({ samePage: prev && parse(prev).path === parse(to).path });
  };

  window.addEventListener('hashchange', () => {
    const r = hashRoute();
    if (r && r !== currentRoute) {
      const prev = currentRoute;
      currentRoute = r;
      render({ samePage: prev && parse(prev).path === parse(r).path });
    }
  });

  function resolve(path, query) {
    const seg = path.split('/').filter(Boolean);
    if (!seg.length) return { page: FX.tpl.home(), section: 'home' };
    const [a, b, ...rest] = seg;
    if (rest.length) return { page: FX.tpl.notFound() };
    if (a === 'concepts') return { page: b ? FX.tpl.article('concept', b, query) : FX.tpl.landing('concept'), section: 'concept' };
    if (a === 'guides') return { page: b ? FX.tpl.article('guide', b, query) : FX.tpl.landing('guide'), section: 'guide' };
    if (a === 'journeys') return { page: b ? FX.tpl.journey(b, query) : FX.tpl.journeysLanding(), section: 'journey' };
    if (a === 'release-notes') return { page: FX.tpl.releases(b, query), section: 'release' };
    if (a === 'search' && !b) return { page: FX.tpl.search(query) };
    if (a === 'about' && !b) return { page: FX.tpl.about() };
    return { page: FX.tpl.notFound() };
  }

  function render({ samePage } = {}) {
    const { path, query } = parse(currentRoute || '/');
    const { page, section } = resolve(path, query);
    const app = $('#app');
    const prevScroll = window.scrollY;
    app.innerHTML = page.html;
    document.title = page.title;
    $('#primary-nav').innerHTML = U.primaryNav(section);
    document.body.classList.remove('nav-open');
    document.body.classList.toggle('is-home', !!page.home);
    closePalette(true);
    enhance();

    const target = query.section || (query.stage ? 'stage-' + query.stage : null);
    if (target && document.getElementById(target)) {
      requestAnimationFrame(() => scrollToId(target, { flash: true, smooth: false }));
    } else if (samePage) {
      window.scrollTo(0, prevScroll);
    } else {
      window.scrollTo(0, 0);
      const main = $('#main');
      if (main) main.focus({ preventScroll: true });
    }
    spy();
  }

  function scrollToId(id, { flash = false, smooth = true } = {}) {
    const el = document.getElementById(id);
    if (!el) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: smooth && !reduce ? 'smooth' : 'auto', block: 'start' });
    if (flash) {
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }
  }

  /* ---------------- Scroll spy for On this page / stepper ---------------- */
  let spyLinks = [];
  function spy() {
    spyLinks = $$('.rail [data-scroll]');
    onScroll();
  }
  function onScroll() {
    if (!spyLinks.length) return;
    let active = null;
    for (const a of spyLinks) {
      const el = document.getElementById(a.dataset.scroll);
      if (el && el.getBoundingClientRect().top < 140) active = a;
    }
    if (!active) active = spyLinks[0];
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) active = spyLinks[spyLinks.length - 1];
    spyLinks.forEach((a) => a.classList.toggle('active', a === active));
  }
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      onScroll();
      ticking = false;
    });
  }, { passive: true });

  /* ---------------- Search box behaviour (palette + hero) ---------------- */
  function attachSearch(input, panel, { perGroup = 4, onClose } = {}) {
    let idx = -1;
    const items = () => $$('[data-result]', panel);
    const setActive = (i) => {
      const list = items();
      idx = list.length ? (i + list.length) % list.length : -1;
      list.forEach((el, j) => el.classList.toggle('active', j === idx));
      if (idx >= 0) list[idx].scrollIntoView({ block: 'nearest' });
    };
    const update = () => {
      panel.innerHTML = U.searchCompact(input.value, perGroup);
      idx = -1;
    };
    input.addEventListener('input', update);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(idx + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(idx - 1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const list = items();
        if (idx >= 0 && list[idx]) FX.go(list[idx].getAttribute('href').slice(1));
        else if (input.value.trim()) FX.go('/search?q=' + encodeURIComponent(input.value.trim()));
      } else if (e.key === 'Escape') onClose && onClose();
    });
    panel.addEventListener('click', (e) => {
      const s = e.target.closest('[data-suggest]');
      if (s) {
        e.preventDefault();
        input.value = s.dataset.suggest;
        update();
        input.focus();
      }
    });
    return { update };
  }

  // Palette
  let palette;
  let lastFocus;
  function openPalette(prefill = '') {
    const p = $('#palette');
    lastFocus = document.activeElement;
    p.hidden = false;
    document.body.classList.add('palette-open');
    const input = $('#palette-input');
    input.value = prefill;
    palette.update();
    input.focus();
  }
  function closePalette(silent) {
    const p = $('#palette');
    if (!p || p.hidden) return;
    p.hidden = true;
    document.body.classList.remove('palette-open');
    if (!silent && lastFocus) lastFocus.focus();
  }

  function renderPalette() {
    $('#palette').innerHTML = `
      <div class="palette-backdrop" data-close-search></div>
      <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Search documentation" data-c="Search palette">
        <div class="palette-input">${icons.search}<label for="palette-input" class="sr-only">Search Fixiam documentation</label><input id="palette-input" type="search" placeholder="Search Fixiam documentation..." autocomplete="off" aria-controls="palette-results"><button type="button" class="kbd-btn" data-close-search>Esc</button></div>
        <div class="palette-results sr-panel" id="palette-results" role="listbox"></div>
        <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
      </div>`;
    palette = attachSearch($('#palette-input'), $('#palette-results'), { onClose: () => closePalette() });
    // Keep focus inside the dialog
    $('#palette').addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = $$('#palette input, #palette a, #palette button').filter((el) => el.offsetParent);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    });
  }

  /* ---------------- Per-page enhancements ---------------- */
  function enhance() {
    // Hero search dropdown
    const hero = $('#hero-q');
    if (hero) {
      const panel = $('#hero-results');
      const close = () => { panel.hidden = true; hero.setAttribute('aria-expanded', 'false'); };
      const s = attachSearch(hero, panel, { perGroup: 3, onClose: close });
      const open = () => { s.update(); panel.hidden = false; hero.setAttribute('aria-expanded', 'true'); };
      hero.addEventListener('focus', open);
      hero.addEventListener('input', open);
      document.addEventListener('click', function off(e) {
        if (!document.body.contains(hero)) return document.removeEventListener('click', off);
        if (!e.target.closest('.hero-search')) close();
      });
    }

    // Search page form
    const sp = $('[data-search-page]');
    if (sp) sp.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = $('#sp-q').value.trim();
      FX.go('/search?q=' + encodeURIComponent(v), { replace: true });
    });

    // Sidebar filter
    const filter = $('#nav-filter');
    if (filter) filter.addEventListener('input', () => {
      const v = filter.value.trim().toLowerCase();
      const tree = $('.sidebar .tree');
      tree.classList.toggle('filtering', !!v);
      $$('.tree-link', tree).forEach((a) => {
        const hit = !v || a.classList.contains('tree-overview') ? !v : a.textContent.toLowerCase().includes(v);
        a.parentElement.hidden = !!v && !hit;
      });
      $$('.tree-group', tree).forEach((g) => {
        const any = $$('.tree-link', g).some((a) => !a.parentElement.hidden);
        g.hidden = !!v && !any;
        g.classList.toggle('filter-open', !!v && any);
      });
      let empty = $('.tree-empty', tree.parentElement);
      const none = v && !$$('.tree-link', tree).some((a) => !a.parentElement.hidden);
      if (none && !empty) tree.insertAdjacentHTML('afterend', `<p class="tree-empty">No pages match “${esc(filter.value)}”. <a href="#/search?q=${encodeURIComponent(filter.value)}">Search all documentation</a></p>`);
      else if (!none && empty) empty.remove();
      else if (none && empty) empty.innerHTML = `No pages match “${esc(filter.value)}”. <a href="#/search?q=${encodeURIComponent(filter.value)}">Search all documentation</a>`;
    });

    // Release note selects
    const yearSel = $('#rn-year'), monthSel = $('#rn-month');
    if (yearSel) {
      yearSel.addEventListener('change', () => FX.go(FX.rnBuild({ year: yearSel.value, ym: '' }), { replace: true }));
      monthSel.addEventListener('change', () => FX.go(FX.rnBuild({ ym: monthSel.value, year: monthSel.value ? monthSel.value.slice(0, 4) : yearSel.value }), { replace: true }));
    }
  }

  /* ---------------- Global delegated events ---------------- */
  document.addEventListener('click', (e) => {
    const t = e.target;

    if (t.closest('.skip-link')) {
      e.preventDefault();
      const m = $('#main');
      if (m) m.focus();
      return;
    }

    const scrollLink = t.closest('[data-scroll]');
    if (scrollLink) {
      e.preventDefault();
      scrollToId(scrollLink.dataset.scroll);
      const det = scrollLink.closest('details.toc-inline');
      if (det) det.open = false;
      return;
    }

    const toastEl = t.closest('[data-toast]');
    if (toastEl) { e.preventDefault(); FX.toast(toastEl.dataset.toast); return; }

    const a = t.closest('a[href^="#/"]');
    if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
      e.preventDefault();
      FX.go(a.getAttribute('href').slice(1), { replace: a.hasAttribute('data-replace') });
      return;
    }

    if (t.closest('[data-open-search]')) { openPalette(); return; }
    if (t.closest('[data-close-search]')) { closePalette(); return; }
    if (t.closest('[data-open-nav]')) { document.body.classList.add('nav-open'); const f = $('#sidebar a, #sidebar button'); f && f.focus(); return; }
    if (t.closest('[data-close-nav]')) { document.body.classList.remove('nav-open'); return; }

    const toggle = t.closest('.tree-toggle');
    if (toggle) {
      const g = toggle.parentElement;
      const open = !g.classList.contains('open');
      g.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open);
      if (open) FX.navOpen.add(g.dataset.node);
      else FX.navOpen.delete(g.dataset.node);
      U.saveOpen();
      return;
    }

    if (t.closest('[data-theme-toggle]')) {
      const next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      FX.store.set('theme', next);
      updateThemeIcon();
      return;
    }

    const ann = t.closest('[data-annotate]');
    if (ann) {
      const on = root.classList.toggle('annotate');
      $$('[data-annotate]').forEach((b) => b.setAttribute('aria-pressed', on));
      FX.toast(on ? 'Template view on. Components are outlined and labelled.' : 'Template view off.');
      return;
    }

    const copyCode = t.closest('[data-copy-code]');
    if (copyCode) {
      const code = copyCode.closest('.code').querySelector('code');
      copyText(code.textContent, code);
      return;
    }
    if (t.closest('[data-copy-link]')) {
      copyText(location.href.split('#')[0] + '#' + currentRoute, null, 'Link copied');
      return;
    }

    const tab = t.closest('[data-tab]');
    if (tab) {
      const wrap = tab.closest('[data-tabs]');
      $$('[data-tab]', wrap).forEach((b) => b.setAttribute('aria-selected', b === tab));
      $$('[data-panel]', wrap).forEach((p) => (p.hidden = p.dataset.panel !== tab.dataset.tab));
      return;
    }

    const fb = t.closest('[data-fb]');
    if (fb) {
      const box = fb.closest('[data-feedback]');
      const v = fb.dataset.fb;
      if (v === 'yes') { $('.fb-ask', box).hidden = true; $('.fb-thanks', box).hidden = false; }
      else if (v === 'no') { $('.fb-ask', box).hidden = true; $('.fb-form', box).hidden = false; $('#fb-text', box).focus(); }
      else if (v === 'cancel') { $('.fb-ask', box).hidden = false; $('.fb-form', box).hidden = true; }
      return;
    }

    const stageBtn = t.closest('[data-stage-toggle]');
    if (stageBtn) {
      const slug = parse(currentRoute).path.split('/')[2];
      const n = +stageBtn.dataset.stageToggle;
      const set = U.journeyDone(slug);
      const marking = !set.has(n);
      if (marking) set.add(n); else set.delete(n);
      U.setJourneyDone(slug, set);
      const total = M.page('journey', slug).stages.length;
      render({ samePage: true });
      if (marking && n < total) FX.toast(`Stage ${n} complete. Next: stage ${n + 1}.`);
      else if (marking) FX.toast('Journey complete.');
      return;
    }

    if (t.closest('[data-journey-reset]')) {
      const slug = parse(currentRoute).path.split('/')[2];
      U.setJourneyDone(slug, new Set());
      render({ samePage: true });
      FX.toast('Progress reset.');
    }
  });

  document.addEventListener('submit', (e) => {
    const form = e.target;
    if (form.matches('.fb-form')) {
      e.preventDefault();
      form.hidden = true;
      form.parentElement.querySelector('.fb-thanks').hidden = false;
    } else if (form.matches('[data-hero-search]')) {
      e.preventDefault();
    }
  });

  function copyText(text, selectEl, msg = 'Copied to clipboard') {
    const fallback = () => {
      if (selectEl) {
        const r = document.createRange();
        r.selectNodeContents(selectEl);
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(r);
        FX.toast('Press Ctrl+C to copy');
      } else FX.toast('Copy is not available here');
    };
    try {
      navigator.clipboard.writeText(text).then(() => FX.toast(msg), fallback);
    } catch (err) {
      fallback();
    }
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) {
      e.preventDefault();
      if ($('#palette').hidden) openPalette();
      else closePalette();
    } else if (e.key === 'Escape') {
      if (!$('#palette').hidden) closePalette();
      document.body.classList.remove('nav-open');
    }
  });

  /* ---------------- Boot ---------------- */
  renderHeader();
  renderPalette();
  $('#year').textContent = FX.SITE.today.slice(0, 4);
  currentRoute = hashRoute() || '/';
  render();
})();

</script>
</body>
</html>
